# action-gate: a pure, deterministic decision gate over a pluggable check
# registry. `evaluate(ActionContext, checks) -> Allow | Deny | Degrade`.
#
# Two crates:
#   action-gate-types  the domain-neutral ActionContext, Decision, Outcome, and
#                      the Check trait (the contract a consumer implements)
#   action-gate-core   the Gate + builder, a stable config hash, canonical
#                      decision serialization, and (optional) two generic
#                      reference checks (secrets, allowlist)
#
# Extracted (relicensed Apache-2.0 by the sole copyright holder) from the Open
# Agentic Platform's crates/policy-kernel (lib.rs). This is the Case-B
# extraction: OAP's hardcoded six-gate `evaluate()` becomes a pluggable Check
# registry, and OAP's code-governance-shaped context becomes the domain-neutral
# ActionContext. OAP's own six checks stay in OAP as registered checks. See
# NOTICE.
#
# Governed by this repo's OWN specs/ corpus, compiled by the pinned spec-spine
# library (the dogfooding pattern spec-spine, tenant-emit, tenant-tail, and
# canonical-keysort-json all follow).

[workspace]
resolver = "2"
members = ["crates/types", "crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/statecrafting/action-gate"
homepage = "https://github.com/statecrafting/action-gate"
authors = ["The action-gate Authors"]

[workspace.dependencies]
action-gate-types = { version = "0.1.0", path = "crates/types" }
canonical-keysort-json = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
