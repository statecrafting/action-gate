# spec-spine governing the action-gate repository (dogfood).
#
# action-gate vends a two-crate pure decision gate; its own specs/ corpus is
# governed by the spec-spine CLI (crate `spec-spine-cli`), pinned below by
# [meta] required_version and installed into the git-ignored `.bin/` by
# `make tools`. `make gate` runs check, lint, couple and index coverage with
# that binary; the compiled registry and index are committed under
# .statecraft/derived/ (spec 003).

[meta]
required_version = "=0.28.0"

[manifest]
metadata_namespace = "action-gate"

[domains]
allowed = []        # disabled: this repo's specs do not declare a `domain`

[kind]
allowed = []        # disabled: `kind` is free-text (symmetric with [domains])

[layout]
specs_dir     = "specs"
derived_dir   = ".statecraft/derived"
standards_dir = "standards/spec"
schemas_dir   = "standards/schemas"
cargo_workspace = "Cargo.toml"
npm_workspaces = []  # none: this is a Rust-only repository
standalone_rust_workspaces = []
standalone_npm_packages    = []

[index]
# The claimed workspace manifest and crate trees are hashed whole (L-008): a
# change to any of them restamps every shard, so `make gate` fails until
# .statecraft/derived/ is regenerated. With three specs over six source files
# that is cheaper and simpler than per-symbol claims.
extra_hashed_inputs = [
  "standards/**/*",
  ".github/workflows/**/*",
  "Cargo.toml",
  "crates/**/*",
]
resolver_exclusions = ["target", ".tooling", ".bin", ".statecraft/derived", "dist", "build"]

[branding]
compiler_id = "spec-spine"
indexer_id  = "spec-spine"

[coupling]
bypass_prefixes = ["**/README.md"]
waiver_keyword = "Spec-Drift-Waiver:"

[frontmatter]
extra_known_keys = []
