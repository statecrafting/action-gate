# action-gate-types: the domain-neutral contract of the gate. ActionContext,
# Decision, Outcome, and the Check trait. Serde only: a crate that only
# implements checks can depend on this without the gate machinery.

[package]
name = "action-gate-types"
# Pinned: the types did not change in 0.2.0 and are not republished.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Domain-neutral types for action-gate: ActionContext, Decision, Outcome, and the Check trait."
keywords = ["policy", "gate", "governance", "decision", "types"]
categories = ["data-structures"]
readme = "../../README.md"
include = ["src/**", "Cargo.toml"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[package.metadata.action-gate]
spec = "000-bootstrap"
